server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — always serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so users always get the latest build
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed static assets can be cached forever (Vite adds content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml text/javascript;
}
